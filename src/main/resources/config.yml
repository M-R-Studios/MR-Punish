# MR-Punish configuration
# Every option is documented here. After editing, run /mrpunish reload.
# Durations use s (seconds), m (minutes), h (hours), d (days), w (weeks), mo (months of 30 days)
# and y (years of 365 days), and can be combined, e.g. "1d12h". "permanent" never expires.

# Do not change. Used to upgrade this file automatically when the plugin updates.
config-version: 1

# Name of this server in punishments, reports and logs. Useful when several servers share one
# MySQL database. Empty = "default". At most 32 characters.
server-name: ""

# Date format for messages and the ban screen (a Java DateTimeFormatter pattern), and the time zone
# ("system" = the server's time zone, or an ID such as "Europe/Warsaw").
date-format: "yyyy-MM-dd HH:mm"
time-zone: system

# Link shown on the ban screen as <appeal-link>.
appeal-link: "https://discord.gg/your-server"

escalation:
  # How far back previous punishments of the same type and reason are counted when working out
  # the next escalation step. A reason can override this with its own history-period.
  # Removed punishments never count. Replaced and expired ones do.
  history-period: 90d

# The fallback reason for each type. It's used when a command's reason doesn't match any configured
# reason or alias, and the whole typed text then becomes the staff note. Each must name an enabled
# reason of that type below.
fallback-reasons:
  WARN: other-warn
  MUTE: other-mute
  BAN: other-ban
  IP_MUTE: other-ipmute
  IP_BAN: other-ipban

# Punishment reasons. Each key is a unique ID stored in history. Don't rename a key that's already
# in use, or old punishments will stop counting towards its escalation.
#   type:           WARN, MUTE, BAN, IP_MUTE or IP_BAN.
#   display:        name shown in GUIs, messages and the ban screen (MiniMessage).
#   description:    lore lines in the reason GUI.
#   icon:           item material in the reason GUI.
#   slot:           optional fixed slot in the reason GUI. Reasons without one fill the free slots in order.
#   aliases:        other words that pick this reason in commands (case-insensitive). Aliases only
#                   need to be unique within one type, so /warn x spam and /mute x spam can pick
#                   different reasons.
#   escalation:     durations for the 1st, 2nd, 3rd... offence. After the last step, the last step
#                   repeats. Not used for WARN.
#   history-period: optional. Overrides escalation.history-period for this reason.
#   permission:     optional extra permission needed to use this reason (on top of the type's).
#   enabled:        false hides the reason from GUIs and commands. Its history stays.
reasons:
  # ---- Warnings ----
  spam-warn:
    type: WARN
    display: "Spam"
    description: ["<gray>Repeated or flooding messages."]
    icon: PAPER
    aliases: [spam, spamming, flood]
  toxicity-warn:
    type: WARN
    display: "Toxicity"
    description: ["<gray>Rude or hostile behaviour."]
    icon: PAPER
    aliases: [toxicity, toxic, rude]
  advertising-warn:
    type: WARN
    display: "Advertising"
    description: ["<gray>Mentioning other servers or services."]
    icon: PAPER
    aliases: [advertising, ad, ads]
  inappropriate-warn:
    type: WARN
    display: "Inappropriate Behaviour"
    description: ["<gray>Behaviour that breaks the rules."]
    icon: PAPER
    aliases: [inappropriate, behaviour, behavior]
  other-warn:
    type: WARN
    display: "Other"
    description: ["<gray>Anything else. Add a note."]
    icon: BOOK
    aliases: [other]

  # ---- Mutes ----
  spam:
    type: MUTE
    display: "Spam"
    description: ["<gray>Repeated or flooding messages."]
    icon: PAPER
    aliases: [spamming, flood]
    escalation: ["10m", "30m", "2h", "1d"]
  toxicity:
    type: MUTE
    display: "Toxicity"
    description: ["<gray>Rude or hostile behaviour."]
    icon: BLAZE_POWDER
    aliases: [toxic, rude]
    escalation: ["2h", "1d", "7d", "30d", "permanent"]
  harassment:
    type: MUTE
    display: "Harassment"
    description: ["<gray>Targeting another player."]
    icon: IRON_SWORD
    aliases: [harass, bullying]
    escalation: ["1d", "7d", "30d", "permanent"]
  discrimination:
    type: MUTE
    display: "Discrimination"
    description: ["<gray>Slurs, hate speech or discrimination."]
    icon: BARRIER
    aliases: [racism, hate, slur]
    escalation: ["7d", "30d", "permanent"]
  advertising:
    type: MUTE
    display: "Advertising"
    description: ["<gray>Mentioning other servers or services."]
    icon: OAK_SIGN
    aliases: [ad, ads]
    escalation: ["1h", "1d", "7d", "permanent"]
  inappropriate:
    type: MUTE
    display: "Inappropriate Behaviour"
    description: ["<gray>Inappropriate messages."]
    icon: ROTTEN_FLESH
    aliases: [behaviour, behavior]
    escalation: ["30m", "2h", "1d", "7d"]
  other-mute:
    type: MUTE
    display: "Other"
    description: ["<gray>Anything else. Add a note."]
    icon: BOOK
    aliases: [other]
    escalation: ["1h", "1d", "7d"]

  # ---- Bans ----
  hacking:
    type: BAN
    display: "Hacking"
    description: ["<gray>Cheat clients, x-ray, kill aura, fly..."]
    icon: DIAMOND_SWORD
    aliases: [hacks, cheating, cheats, xray]
    escalation: ["7d", "30d", "permanent"]
  exploiting:
    type: BAN
    display: "Exploiting"
    description: ["<gray>Abusing bugs or duplication glitches."]
    icon: TNT
    aliases: [exploit, dupe, duping, bug]
    escalation: ["3d", "14d", "permanent"]
  griefing:
    type: BAN
    display: "Griefing"
    description: ["<gray>Destroying or stealing other players' builds."]
    icon: FLINT_AND_STEEL
    aliases: [grief]
    escalation: ["3d", "14d", "60d", "permanent"]
  scamming:
    type: BAN
    display: "Scamming"
    description: ["<gray>Tricking players out of items or money."]
    icon: GOLD_INGOT
    aliases: [scam]
    escalation: ["7d", "30d", "permanent"]
  harassment-ban:
    type: BAN
    display: "Harassment"
    description: ["<gray>Severe or repeated harassment."]
    icon: IRON_SWORD
    aliases: [harassment, harass]
    escalation: ["3d", "30d", "permanent"]
  discrimination-ban:
    type: BAN
    display: "Discrimination"
    description: ["<gray>Severe or repeated discrimination."]
    icon: BARRIER
    aliases: [discrimination, racism, hate]
    escalation: ["7d", "permanent"]
  advertising-ban:
    type: BAN
    display: "Advertising"
    description: ["<gray>Advertising bots or repeated advertising."]
    icon: OAK_SIGN
    aliases: [advertising, ad, ads]
    escalation: ["7d", "permanent"]
  inappropriate-ban:
    type: BAN
    display: "Inappropriate Behaviour"
    description: ["<gray>Inappropriate builds, skins or names."]
    icon: ROTTEN_FLESH
    aliases: [inappropriate, behaviour, behavior]
    escalation: ["1d", "7d", "30d"]
  freeze-logout:
    type: BAN
    display: "Logging out while frozen"
    description: ["<gray>Used by freeze.on-quit: BAN."]
    icon: PACKED_ICE
    aliases: [frozenlogout, logout]
    escalation: ["7d", "30d", "permanent"]
  other-ban:
    type: BAN
    display: "Other"
    description: ["<gray>Anything else. Add a note."]
    icon: BOOK
    aliases: [other]
    escalation: ["1d", "7d", "30d"]

  # ---- IP mutes (only used when ip.enabled is true) ----
  spam-ip:
    type: IP_MUTE
    display: "Spam (alts)"
    description: ["<gray>Spamming from several accounts."]
    icon: PAPER
    aliases: [spam, spamming]
    escalation: ["1d", "7d", "permanent"]
  advertising-ip:
    type: IP_MUTE
    display: "Advertising (alts)"
    description: ["<gray>Advertising from several accounts."]
    icon: OAK_SIGN
    aliases: [advertising, ad, ads]
    escalation: ["7d", "permanent"]
  other-ipmute:
    type: IP_MUTE
    display: "Other"
    description: ["<gray>Anything else. Add a note."]
    icon: BOOK
    aliases: [other]
    escalation: ["1d", "7d", "30d"]

  # ---- IP bans (only used when ip.enabled is true) ----
  ban-evasion:
    type: IP_BAN
    display: "Ban evasion"
    description: ["<gray>Joining on another account while banned."]
    icon: ENDER_EYE
    aliases: [evasion, evading, alt]
    escalation: ["30d", "permanent"]
  hacking-ip:
    type: IP_BAN
    display: "Hacking (alts)"
    description: ["<gray>Cheating on several accounts."]
    icon: DIAMOND_SWORD
    aliases: [hacking, hacks, cheating]
    escalation: ["30d", "permanent"]
  other-ipban:
    type: IP_BAN
    display: "Other"
    description: ["<gray>Anything else. Add a note."]
    icon: BOOK
    aliases: [other]
    escalation: ["7d", "30d"]

warnings:
  # How long a warning shows as "Active" and counts in the active punishment count.
  # Display only: escalation uses the history period above. "permanent" = always active.
  active-for: 90d
  # Show the warned player a title and subtitle (texts in messages.yml) as well as the chat message.
  title: true

mute:
  # Commands a muted player can't use. Aliases and namespaced forms (/essentials:msg, /minecraft:tell)
  # count too: a command is blocked if its name or any of its aliases is in this list, and so is an
  # alias from the server's commands.yml that runs one of them.
  blocked-commands: [msg, tell, w, whisper, r, reply, me, say, mail, m, t, pm, dm, message, emsg, etell, ereply, er, broadcast, bc, shout, helpop, teammsg, tm]
  # Block writing on signs while muted.
  block-signs: true
  # Block signing books while muted (writing a book is allowed, signing it isn't).
  block-books: true
  # Minimum seconds between two "you are muted" messages to the same player.
  notify-cooldown-seconds: 3

announcements:
  # Tell every player when someone is punished. Never includes IP addresses or staff notes.
  # A silent punishment never announces. Staff with mrpunish.notify are always notified.
  WARN: false
  MUTE: false
  BAN: true
  IP_MUTE: false
  IP_BAN: true

ban:
  # Kick the banned player straight away if they're online. The ban always blocks joining.
  kick-online: true

ip:
  # Turn IP punishments (/muteip, /banip, /unmuteip, /unbanip) and IP tracking on. Changing this needs a restart.
  # When off, no IP information is stored at all, and the IP commands say they're disabled.
  # IPs are never stored as plain text, only as a keyed hash (the secret is in ip-secret.key: back it up,
  # a lost key can't be recovered). On a network sharing MySQL, copy the same ip-secret.key to every server.
  enabled: false
  # Accounts seen on the same IP within this many days count as "associated". Their rank is checked
  # before an IP punishment, and they're counted in staff messages. Range 1-365.
  association-days: 30
  # Delete an account's link to an IP after this many days without a login from it. 0 = keep forever.
  # The IP hash inside an IP punishment is kept as long as the punishment record exists.
  retention-days: 90
  # IPv6 addresses are grouped by this prefix length before hashing (a home connection usually owns a
  # whole /64). Range 32-128.
  ipv6-prefix: 64
  # When ip.enabled is false, delete stored IP links at startup.
  purge-when-disabled: true

login:
  # What to do when a joining player's punishments can't be checked (database down or too slow).
  # CACHE: use the in-memory copy of active bans. A player banned in the copy is denied. Others are
  #        let in and checked again once the database is back. If the copy was never loaded
  #        (database down since startup), the player is denied with the "try again" screen.
  # DENY:  deny everyone who can't be checked, with the "try again" screen.
  # ALLOW: let everyone in and check them again once the database is back. Banned players can
  #        get in while it's down, so only use this if downtime costs you more than that.
  # Every failure is logged, and online players with mrpunish.admin are alerted (at most once a minute).
  fail-policy: CACHE
  # Milliseconds to wait for the database during login before applying the fail policy. Range 500-10000.
  timeout-ms: 3000

input:
  # Maximum length of typed text: notes and removal reasons. Longer text is cut. Range 16-500.
  max-text-length: 200

# Turn MR-Punish commands off so that another plugin or vanilla gets that label instead, and add
# extra labels. The namespaced form (e.g. /mr-punish:ban) always works. Changing these needs a restart.
# When a command is off, /mr-punish:<name> still works and the plain label stays with vanilla or the
# other plugin. More entries appear here as their commands are added to MR-Punish. /mrpunish itself
# (aliases /staffhelper and /mrp) is always on.
commands:
  ban:   { enabled: true, aliases: [] }
  unban: { enabled: true, aliases: [] }
  warn:   { enabled: true, aliases: [] }
  unwarn: { enabled: true, aliases: [] }
  mute:   { enabled: true, aliases: [] }
  unmute: { enabled: true, aliases: [] }
  muteip:   { enabled: true, aliases: [ipmute] }
  banip:    { enabled: true, aliases: [ipban] }
  unmuteip: { enabled: true, aliases: [ipunmute] }
  unbanip:  { enabled: true, aliases: [ipunban] }

storage:
  # SQLITE (a file in plugins/MR-Punish/) or MYSQL (also MariaDB). Changing this needs a restart.
  # Data isn't copied between them. Several servers can share one MySQL database; SQLite is for
  # one server only.
  type: SQLITE
  sqlite:
    # File name inside plugins/MR-Punish/.
    file: punishments.db
  mysql:
    # Address and port of the MySQL or MariaDB server.
    host: localhost
    port: 3306
    # The database (schema) to use. It must already exist.
    database: mrpunish
    # Login for the database.
    username: mrpunish
    password: ""
    # Prefix for table names, so MR-Punish can share a database with other plugins.
    # Lower-case letters, digits and _ only, at most 16 characters.
    table-prefix: "mrpunish_"
    # Maximum open connections. Range 2-20.
    pool-size: 4
    # Extra JDBC connection properties.
    properties:
      sslMode: PREFERRED

hooks:
  # Use LuckPerms (if installed) to check the rank of offline players. Without it, an offline
  # player's rank is the one they had when they were last online. Changing this needs a restart.
  luckperms: true

sounds:
  # Each sound: enabled, sound key (e.g. minecraft:block.note_block.pling), volume (0.0-10.0), pitch (0.5-2.0).
  # Played to staff with each punishment or removal notification.
  notify: { enabled: true, sound: minecraft:block.note_block.pling, volume: 0.6, pitch: 1.4 }
  # Played to the staff member when a punishment is applied.
  punished: { enabled: true, sound: minecraft:block.anvil.land, volume: 0.6, pitch: 1.0 }
  # Played to the staff member when an action is refused or fails.
  failed: { enabled: true, sound: minecraft:entity.villager.no, volume: 1.0, pitch: 1.0 }
  # Played to the warned player.
  warned: { enabled: true, sound: minecraft:block.note_block.bass, volume: 1.0, pitch: 0.6 }
