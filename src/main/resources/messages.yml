# MR-Punish messages. MiniMessage format: https://docs.advntr.dev/minimessage/format
# <prefix> inserts the prefix below into any message. Set a message to "" to send nothing.

# Do not change. Used to upgrade this file automatically when the plugin updates.
messages-version: 1

prefix: "<gradient:#ef4444:#f97316>MR-Punish</gradient> <dark_gray>»</dark_gray> "

general:
  no-permission: "<prefix><red>You don't have permission to do that."
  # Shown as the duration of permanent punishments.
  permanent: "permanent"
  # Shown as the duration of warnings, which have none.
  warning-offence: "offence <offence>"
  # Who is named as the staff member when console acts.
  console-name: "Console"

notify:
  # Staff notifications (mrpunish.notify, except the staff member who acted) and console.
  # Never include IP addresses.
  issued: "<dark_gray>[<red>MR<dark_gray>] <white><staff></white> <gray><type-verb></gray> <white><target></white> <gray>for</gray> <reason> <gray>(<duration>, #<id><silent>)<note>"
  removed: "<dark_gray>[<red>MR<dark_gray>] <white><staff></white> <gray>removed <type> #<ids> from</gray> <white><target></white><gray>: <removal-reason>"
  # Added after "issued" for IP punishments: only a count of accounts, never an address.
  ip-suffix: " <gray>[IP, <accounts> account(s)]"
  silent-tag: ", silent"
  note-suffix: " <dark_gray>Note: <gray><note>"
  no-reason: "No reason given"
  verbs: { WARN: warned, MUTE: muted, BAN: banned, IP_MUTE: IP-muted, IP_BAN: IP-banned }
  # Sent to online players with mrpunish.admin, and to admins who join while the database is down.
  storage-down: "<dark_gray>[<red>MR<dark_gray>] <red>The MR-Punish database is unavailable. Punishments can't be saved until it's back."
  storage-back: "<dark_gray>[<red>MR<dark_gray>] <green>The MR-Punish database is back."

# Public announcements (announcements.* in config.yml). Never include staff notes or IPs.
announce:
  WARN: "<red><target> was warned for <reason>."
  MUTE: "<red><target> was muted for <reason>."
  BAN: "<red><target> was banned for <reason>."
  IP_MUTE: "<red><target> was muted for <reason>."
  IP_BAN: "<red><target> was banned for <reason>."

# Names of the punishment types in messages.
types:
  WARN: "warning"
  MUTE: "mute"
  BAN: "ban"
  IP_MUTE: "IP mute"
  IP_BAN: "IP ban"

admin:
  # /mrpunish help. Each command's line is only shown to senders who may use it.
  help-header: "<prefix><white>MR-Punish commands:"
  help:
    reload: "<prefix><white>/mrpunish reload</white> <gray>- reload all configuration files"
    version: "<prefix><white>/mrpunish version</white> <gray>- version, storage and command clashes"
  # Shown instead when the sender can't use any of the commands above.
  help-none: "<prefix><gray>There are no MR-Punish commands you can use."
  # <version>: MR-Punish version. <server>: server software and Minecraft version.
  # <storage>: the database in use. <storage-status>: connected, or why not.
  # <clashes>: command labels another plugin owns instead of MR-Punish, or "none".
  version: "<prefix><gray>MR-Punish <white><version></white> on <white><server></white>. Storage: <white><storage></white> (<storage-status>). Clashes: <white><clashes></white>"
  reload-success: "<prefix><green>Reloaded config.yml, messages.yml, gui.yml, permissions.yml and scoreboard.yml."
  reload-warnings: "<prefix><yellow>Reloaded with <count> warning(s):"
  reload-failed: "<prefix><red>Reload failed for <file>; kept the previous settings for it:"
  reload-detail: "<gray> - <detail>"
  reload-restart-needed: "<prefix><yellow>These changes need a restart to apply: <what>"
