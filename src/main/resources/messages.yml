# MR-Punish messages. MiniMessage format: https://docs.advntr.dev/minimessage/format
# <prefix> inserts the prefix below into any message. Set a message to "" to send nothing.

# Do not change. Used to upgrade this file automatically when the plugin updates.
messages-version: 1

prefix: "<gradient:#ef4444:#f97316>MR-Punish</gradient> <dark_gray>»</dark_gray> "

general:
  no-permission: "<prefix><red>You don't have permission to do that."
  # Shown as the duration of permanent punishments.
  permanent: "permanent"
  # Shown as the duration of warnings, which have none.
  warning-offence: "offence <offence>"
  # Who is named as the staff member when console acts.
  console-name: "Console"
  player-only: "<prefix><red>Only players can use this command."
  invalid-player: "<prefix><red>'<input>' isn't a valid player name."
  unknown-player: "<prefix><red><player> has never joined this server."
  storage-unavailable: "<prefix><red>The database is unavailable, so nothing was changed. Try again shortly."
  server-stopping: "<prefix><red>The server is stopping."
  usage: "<prefix><gray>Usage: <white><usage>"

punish:
  # Sent to the staff member
  warned: "<prefix><green>Warned <white><player></white> for <reason> <gray>(#<id>, offence <offence>)."
  muted: "<prefix><green>Muted <white><player></white> for <reason> <gray>(<duration>, #<id>, offence <offence>)."
  banned: "<prefix><green>Banned <white><player></white> for <reason> <gray>(<duration>, #<id>, offence <offence>)."
  ip-muted: "<prefix><green>IP-muted <white><player></white> for <reason> <gray>(<duration>, #<id>, <accounts> associated account(s))."
  ip-banned: "<prefix><green>IP-banned <white><player></white> for <reason> <gray>(<duration>, #<id>, <accounts> associated account(s))."
  ip-rank: "<prefix><red>You can't IP-punish <player>: <count> account(s) on that IP have a rank equal to or higher than yours, or are exempt."
  ip-disabled: "<prefix><red>IP punishments are turned off (ip.enabled in config.yml)."
  ip-unknown: "<prefix><red>No IP is known for <player> yet. They need to join once while IP features are on."
  replaced: "<prefix><gray>This replaces #<old-id>."
  failed: "<prefix><red>The punishment could not be saved, so it was NOT applied (error <error-id>)."
  would-shorten: "<prefix><red><player> already has an active <type> (#<id>) that ends <end> (<remaining> left). A new one can't end sooner. Remove it first to shorten it."
  would-shorten-permanent: "<prefix><red><player> already has a permanent <type> (#<id>). A new one can't end sooner. Remove it first to shorten it."
  self: "<prefix><red>You can't punish yourself."
  rank: "<prefix><red>You can't punish <player>: their rank is equal to or higher than yours."
  exempt: "<prefix><red><player> is exempt. Only console can punish them."
  reason-no-permission: "<prefix><red>You can't use the reason <reason>."
  busy: "<prefix><gray>Still saving the previous action…"

unpunish:
  removed: "<prefix><green>Removed <count> <type>(s) from <white><player></white> <gray>(<ids>)."
  none: "<prefix><red><player> has no active <type>."
  issuer-rank: "<prefix><red>#<id> was issued by a higher rank than yours, so you can't remove it."
  self: "<prefix><red>You can't remove your own punishment."
  failed: "<prefix><red>The removal could not be saved, so nothing was removed (error <error-id>)."
  unwarn-not-found: "<prefix><red>No active warning #<id> for <player>."

# Sent to the punished player
target:
  # Sent to a warned player who is online (lines), plus a title if warnings.title is true.
  warn-chat:
    - "<red><bold>You have been warned"
    - "<gray>Reason: <white><reason>"
    - "<gray>By: <white><staff>"
  warn-title: "<red>Warning"
  warn-subtitle: "<white><reason>"
  # Shown on join for each warning given while the player was offline.
  warn-offline: "<prefix><red>You were warned while offline: <white><reason></white> <gray>(<date>)"
  # Sent to a muted player who is online. <appeal-click>...</appeal-click> makes the text open the appeal link.
  mute-chat:
    - "<red><bold>You have been muted"
    - "<gray>Reason: <white><reason>"
    - "<gray>Duration: <white><duration>"
    - "<gray>Appeal: <white><appeal-click><appeal-link></appeal-click>"
  # Sent when a muted player tries to chat or use a blocked command (at most every few seconds).
  muted-blocked: "<prefix><red>You are muted for <white><reason></white>. <gray><remaining> left. Appeal: <appeal-link>"
  muted-blocked-permanent: "<prefix><red>You are permanently muted for <white><reason></white>. <gray>Appeal: <appeal-link>"
  unmuted: "<prefix><green>You are no longer muted."
  # Lines of the screen a banned player sees when kicked or trying to join.
  ban-screen:
    - "<red><bold>You are banned from this server"
    - ""
    - "<gray>Reason: <white><reason>"
    - "<gray>Banned by: <white><staff>"
    - "<gray>Expires: <white><expires> <gray>(<remaining> left)"
    - "<gray>Ban ID: <white>#<id>"
    - ""
    - "<gray>Appeal at <white><appeal-link>"
  ban-screen-permanent:
    - "<red><bold>You are permanently banned from this server"
    - ""
    - "<gray>Reason: <white><reason>"
    - "<gray>Banned by: <white><staff>"
    - "<gray>Ban ID: <white>#<id>"
    - ""
    - "<gray>Appeal at <white><appeal-link>"
  # Shown at login when punishments can't be checked (login.fail-policy).
  login-unverified:
    - "<red>We couldn't check your account right now."
    - "<gray>Please try again in a minute."

notify:
  # Staff notifications (mrpunish.notify, except the staff member who acted) and console.
  # Never include IP addresses.
  issued: "<dark_gray>[<red>MR<dark_gray>] <white><staff></white> <gray><type-verb></gray> <white><target></white> <gray>for</gray> <reason> <gray>(<duration>, #<id><silent>)<note>"
  removed: "<dark_gray>[<red>MR<dark_gray>] <white><staff></white> <gray>removed <type> #<ids> from</gray> <white><target></white><gray>: <removal-reason>"
  # Added after "issued" for IP punishments: only a count of accounts, never an address.
  ip-suffix: " <gray>[IP, <accounts> account(s)]"
  silent-tag: ", silent"
  note-suffix: " <dark_gray>Note: <gray><note>"
  no-reason: "No reason given"
  verbs: { WARN: warned, MUTE: muted, BAN: banned, IP_MUTE: IP-muted, IP_BAN: IP-banned }
  # Sent to online players with mrpunish.admin, and to admins who join while the database is down.
  storage-down: "<dark_gray>[<red>MR<dark_gray>] <red>The MR-Punish database is unavailable. Punishments can't be saved until it's back."
  storage-back: "<dark_gray>[<red>MR<dark_gray>] <green>The MR-Punish database is back. <count> player(s) were re-checked."
  # Sent to mrpunish.admin (at most once a minute) when logins couldn't be checked.
  login-check-failed: "<dark_gray>[<red>MR<dark_gray>] <red>Couldn't check punishments for logins (database <reason>). Policy: <policy>."

# Public announcements (announcements.* in config.yml). Never include staff notes or IPs.
announce:
  WARN: "<red><target> was warned for <reason>."
  MUTE: "<red><target> was muted for <reason>."
  BAN: "<red><target> was banned for <reason>."
  IP_MUTE: "<red><target> was muted for <reason>."
  IP_BAN: "<red><target> was banned for <reason>."

# Names of the punishment types in messages.
types:
  WARN: "warning"
  MUTE: "mute"
  BAN: "ban"
  IP_MUTE: "IP mute"
  IP_BAN: "IP ban"

admin:
  # /mrpunish help. Each command's line is only shown to senders who may use it.
  help-header: "<prefix><white>MR-Punish commands:"
  help:
    reload: "<prefix><white>/mrpunish reload</white> <gray>- reload all configuration files"
    version: "<prefix><white>/mrpunish version</white> <gray>- version, storage and command clashes"
    import: "<prefix><white>/mrpunish import vanilla [--clear]</white> <gray>- import the vanilla ban list"
  # Shown instead when the sender can't use any of the commands above.
  help-none: "<prefix><gray>There are no MR-Punish commands you can use."
  # <version>: MR-Punish version. <server>: server software and Minecraft version.
  # <storage>: the database in use. <storage-status>: connected, or why not. <ip-features>: IP features on or off (never an address).
  # <clashes>: command labels another plugin owns instead of MR-Punish, or "none".
  version: "<prefix><gray>MR-Punish <white><version></white> on <white><server></white>. Storage: <white><storage></white> (<storage-status>). IP features: <white><ip-features></white>. Clashes: <white><clashes></white>"
  reload-success: "<prefix><green>Reloaded config.yml, messages.yml, gui.yml, permissions.yml and scoreboard.yml."
  reload-warnings: "<prefix><yellow>Reloaded with <count> warning(s):"
  reload-failed: "<prefix><red>Reload failed for <file>; kept the previous settings for it:"
  reload-detail: "<gray> - <detail>"
  reload-restart-needed: "<prefix><yellow>These changes need a restart to apply: <what>"
  import-start: "<prefix><gray>Importing vanilla bans…"
  import-done: "<prefix><green>Imported <players> player ban(s). Skipped <skipped> already imported, <unknown> unreadable."
  import-cleared: "<prefix><green>Removed <count> imported entries from the vanilla ban list."
  import-done-ips: "<prefix><green>Imported <ips> IP ban(s)."
  import-ip-disabled: "<prefix><yellow><count> vanilla IP ban(s) were skipped: IP features are off."
  import-failed: "<prefix><red>Import failed (error <error-id>). Nothing was imported or cleared."
