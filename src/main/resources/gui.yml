# MR-Punish GUIs. Every title, slot, item, name, lore line and sound can be changed.
# Names and lore use MiniMessage. Slots are 0-based (row * 9 + column).
# Every item has: material, name, lore (list), and optionally glint: true and custom-model-data (a number).
# Nothing can be taken out of, moved in or put into any MR-Punish menu.

# Do not change. Used to upgrade this file automatically when the plugin updates.
gui-version: 1

# The item in every empty slot.
filler: { material: GRAY_STAINED_GLASS_PANE, name: " " }

# What staff see for a button they don't have permission for.
# GREY: show the item below instead (<name> is the button's name). HIDE: show filler.
no-permission:
  mode: GREY
  item: { material: GRAY_DYE, name: "<gray><name>", lore: ["<red>You don't have permission."] }

# Each sound: enabled, sound key, volume (0.0-10.0), pitch (0.5-2.0).
sounds:
  # A button was clicked.
  click:  { enabled: true, sound: minecraft:ui.button.click, volume: 0.6, pitch: 1.0 }
  # A button was refused (no permission, or not possible right now).
  denied: { enabled: true, sound: minecraft:block.note_block.bass, volume: 0.8, pitch: 0.5 }
  # A page was turned or a filter changed.
  page:   { enabled: true, sound: minecraft:item.book.page_turn, volume: 0.8, pitch: 1.0 }

# Names of the punishment types in menus (<type-name>).
type-names: { WARN: Warning, MUTE: Mute, BAN: Ban, IP_MUTE: IP mute, IP_BAN: IP ban }

common:
  close:    { material: BARRIER, name: "<red>Close" }
  back:     { material: ARROW, name: "<gray>Back" }
  # Shown where data goes until it has loaded.
  loading:  { material: CLOCK, name: "<gray>Loading…" }
  previous: { material: ARROW, name: "<gray>Previous page" }
  next:     { material: ARROW, name: "<gray>Next page" }

# /punish <player>
punish-menu:
  title: "Punish <player>"
  rows: 5
  head:
    slot: 4
    # The player's head. <uuid>, <status>, <rank>, <active>, <total>; <previous> becomes one line per entry.
    name: "<white><player>"
    lore:
      - "<dark_gray><uuid>"
      - "<gray>Status: <status>"
      - "<gray>Rank: <rank>"
      - "<gray>Active punishments: <white><active>"
      - "<gray>Total punishments: <white><total>"
      - "<gray>Previous offences:"
      - "<previous>"
    online: "<green>online"
    offline: "<red>offline <gray>(last seen <date>)"
    # Shown as the rank of players without one.
    no-rank: "<gray>Player"
    # One line per previous punishment (the last 3); <none> when there are none.
    previous-line: "<dark_gray>- <gray><type> <white><reason> <dark_gray><date>"
    none: "<dark_gray>none"
  # One button per type. <active> is the player's active count of that type.
  categories:
    WARN:    { slot: 19, material: PAPER,         name: "<yellow>Warnings", lore: ["<gray>Active: <white><active>", "<gray>Applied immediately."] }
    MUTE:    { slot: 20, material: BOOK,          name: "<gold>Mutes",    lore: ["<gray>Active: <white><active>"] }
    BAN:     { slot: 21, material: IRON_AXE,      name: "<red>Bans",      lore: ["<gray>Active: <white><active>"] }
    IP_MUTE: { slot: 23, material: WRITABLE_BOOK, name: "<gold>IP Mutes", lore: ["<gray>Active: <white><active>", "<dark_gray>Affects every account on the IP."] }
    IP_BAN:  { slot: 24, material: NETHERITE_AXE, name: "<dark_red>IP Bans", lore: ["<gray>Active: <white><active>", "<dark_gray>Affects every account on the IP."] }
  # The player's history (needs mrpunish.history). <total>: how many punishments.
  history: { slot: 25, material: BOOKSHELF, name: "<aqua>History", lore: ["<gray>Punishments: <white><total>"] }
  # Added to the IP buttons while IP features are off (they can't be used then).
  ip-disabled-lore: ["<dark_gray>IP features are off."]
  close-slot: 40

# The reasons of one type, with what each would do now.
reason-menu:
  title: "<type-name> – <player>"
  rows: 6
  # Reasons without a slot in config.yml fill these slots in order.
  slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  reason-lore:
    - "<description>"
    - ""
    - "<gray>Offence: <white><offence-ordinal>"
    - "<gray>Previous: <white><previous></white> in the last <period>"
    - "<gray>Next punishment: <white><next>"
    - "<gray>Escalation: <ladder>"
    - ""
    - "<action>"
  # <period> when a reason counts every earlier offence.
  period-forever: "all time"
  # <next>: what the click would give.
  next-warn: "Warning"
  next-timed: "<type-name> for <duration>"
  next-permanent: "<type-name>, permanent"
  # <ladder>: the escalation steps, the one that would be used now highlighted.
  ladder-step: "<gray><duration>"
  ladder-current: "<white><u><duration></u>"
  ladder-separator: "<dark_gray> → "
  # <ladder> of warnings (they have no durations).
  ladder-none: "<dark_gray>none"
  # <action>: what clicking does.
  action-warn: "<green>Click to warn"
  action-review: "<yellow>Click to review"
  action-replaces: "<yellow>Replaces #<id> · click to review"
  action-blocked: "<red>Blocked: active <type-name> #<id> ends later (<remaining> left)"
  note:
    slot: 49
    material: NAME_TAG
    name: "<white>Note"
    lore: ["<gray><note>", "", "<yellow>Click to type a note", "<gray>Shift-click to clear"]
    # <note> when there is none.
    empty: "<dark_gray>none"
  back-slot: 45

# Shown before a mute, ban, IP mute or IP ban is applied.
confirm-menu:
  title: "Confirm <type-name>"
  rows: 3
  summary:
    slot: 4
    material: PAPER
    name: "<white><type-name>: <player>"
    lore:
      - "<gray>Reason: <white><reason>"
      - "<gray>Offence: <white><offence-ordinal>"
      - "<gray>Duration: <white><duration>"
      - "<gray>Ends: <white><end>"
      - "<replaces>"
      - "<accounts>"
      - "<gray>Note: <white><note>"
  # <replaces> and <accounts> lines; empty when they don't apply.
  replaces-line: "<yellow>Replaces #<id>"
  accounts-line: "<gray>Affects <white><accounts></white> associated account(s)"
  # <end> of a permanent punishment.
  never: "never"
  confirm: { slot: 11, material: LIME_CONCRETE, name: "<green><bold>Confirm", lore: ["<gray><type-name> <player> for <duration>"] }
  note:    { slot: 13, material: NAME_TAG, name: "<white>Note", lore: ["<gray><note>", "<yellow>Click to change", "<gray>Shift-click to clear"] }
  cancel:  { slot: 15, material: RED_CONCRETE, name: "<red><bold>Cancel" }
  silent:
    slot: 22
    when-on:  { material: ENDER_EYE, name: "<gray>Silent: <green>on", lore: ["<gray>No public announcement."] }
    when-off: { material: ENDER_PEARL, name: "<gray>Silent: <red>off", lore: ["<gray>Announced if enabled in config."] }
  # Shown on the confirm button while the punishment is being saved.
  submitting: { material: CLOCK, name: "<gray>Saving…" }

# /history <player>: 45 entries per page, newest first. Includes IP punishments on any IP the
# player was seen with recently (marked "(IP)").
history-menu:
  title: "History – <player> (<page>/<pages>)"
  rows: 6
  # <type-name>, <id>, <reason>
  entry-name: "<white>#<id> <type-name> <dark_gray>– <white><reason>"
  # Lines that are empty for an entry (no note, not removed...) are left out.
  entry-lore:
    - "<gray>Status: <status>"
    - "<gray>Duration: <white><duration>"
    - "<gray>Issued: <white><issued>"
    - "<gray>Expires: <white><expires>"
    - "<gray>By: <white><staff>"
    - "<gray>Offence: <white><offence-ordinal>"
    - "<note-line>"
    - "<removed-line>"
    - "<replaced-line>"
    - "<ip-line>"
    - ""
    - "<action-line>"
  note-line: "<gray>Note: <white><note>"
  removed-line: "<aqua>Removed by <white><by></white> on <white><date></white>: <white><reason>"
  replaced-line: "<yellow>Replaced by #<by-id> on <white><date>"
  ip-line: "<dark_gray>(IP, applies to <accounts> account(s))"
  # <expires> of a permanent punishment, and of one that never had an end (warnings kept forever).
  never: "never"
  action-remove: "<yellow>Left-click for details · Right-click to remove"
  action-details: "<yellow>Left-click for details"
  # The item of each status (only the material, glint and custom-model-data are used).
  status-items:
    ACTIVE:       { material: RED_CONCRETE, glint: true }
    EXPIRED:      { material: GRAY_CONCRETE }
    REMOVED:      { material: LIGHT_BLUE_CONCRETE }
    REPLACED:     { material: YELLOW_CONCRETE }
    NOT_ENFORCED: { material: BLACK_CONCRETE }
  # Shown when nothing matches the filters.
  empty: { slot: 22, material: BARRIER, name: "<gray>No punishments" }
  # <filter>: the current type or status.
  type-filter:   { slot: 47, material: HOPPER, name: "<gray>Type: <white><filter>", lore: ["<yellow>Click to change"] }
  status-filter: { slot: 48, material: COMPARATOR, name: "<gray>Status: <white><filter>", lore: ["<yellow>Click to change"] }
  filter-all: "All"
  previous-slot: 45
  back-slot: 49
  next-slot: 53

# One punishment from the history, with its Remove button.
history-detail:
  title: "#<id> – <player>"
  rows: 3
  entry-slot: 13
  remove: { slot: 11, material: LAVA_BUCKET, name: "<red>Remove this <type-name>", lore: ["<gray>You'll be asked for a reason."] }
  # Instead of Remove when it can't be removed (not active).
  not-removable: { slot: 11, material: GRAY_DYE, name: "<gray>Can't be removed", lore: ["<gray>Only active punishments can be removed."] }
  back-slot: 15

# /report <player> without a reason: the configured reasons (config.yml reports.reasons) and "Other".
report-reason-menu:
  title: "Report <player>"
  rows: 3
  slots: [10, 11, 12, 13, 14, 15, 16]
  # Each reason uses its icon from config.yml; <reason> is its display.
  reason-name: "<white><reason>"
  reason-lore: ["<yellow>Click to report <player> for this"]
  other: { slot: 22, material: WRITABLE_BOOK, name: "<white>Other", lore: ["<gray>Type a reason in chat (or a form on Bedrock)."] }
  close-slot: 26

# /reports: 45 a page. Open and claimed reports oldest first, closed ones newest first.
reports-menu:
  title: "Reports – <filter> (<page>/<pages>)"
  rows: 6
  # Each report is the reported player's head.
  entry-name: "<white>#<id> <target>"
  entry-lore:
    - "<gray>Reported by: <white><reporter>"
    - "<gray>Reason: <white><reason>"
    - "<gray>Submitted: <white><date></white> <dark_gray>(<ago> ago)"
    - "<gray>Server: <white><server>"
    - "<gray>Status: <status>"
    - "<claimed-line>"
    - "<gray>Notes: <white><notes>"
    - ""
    - "<yellow>Click for details"
  claimed-line: "<gray>Claimed by: <white><staff>"
  # Names of the filters (<filter>).
  filters: { OPEN: Open, CLAIMED: Claimed, MINE: Claimed by me, CLOSED: Closed, ALL: All }
  empty: { slot: 22, material: BARRIER, name: "<gray>No reports" }
  filter: { slot: 47, material: HOPPER, name: "<gray>Showing: <white><filter>", lore: ["<yellow>Click to change"] }
  previous-slot: 45
  close-slot: 49
  next-slot: 53

# One report with its actions. Every button checks permission when clicked.
report-detail:
  title: "Report #<id>"
  rows: 5
  summary:
    slot: 4
    material: PAPER
    name: "<white>#<id> <target>"
    lore:
      - "<gray>Reported by: <white><reporter>"
      - "<gray>Reason: <white><reason>"
      - "<gray>Submitted: <white><date></white> <dark_gray>(<ago> ago)"
      - "<gray>Server: <white><server>"
      - "<gray>Location: <white><location>"
      - "<gray>Status: <status>"
      - "<claimed-line>"
      - "<closed-line>"
  # <location> when the reporter's location isn't known.
  no-location: "unknown"
  closed-line: "<gray>Closed by <white><staff></white> on <white><date></white><gray>: <white><note>"
  claim:   { slot: 10, material: LIME_DYE, name: "<green>Claim", lore: ["<gray>Mark that you're handling it."] }
  unclaim: { slot: 10, material: GRAY_DYE, name: "<yellow>Unclaim", lore: ["<gray>Let someone else handle it."] }
  resolve: { slot: 12, material: EMERALD, name: "<green>Resolve", lore: ["<gray>The report was right. You'll be asked for a note."] }
  reject:  { slot: 14, material: REDSTONE, name: "<red>Reject", lore: ["<gray>Nothing to act on. You'll be asked for a note."] }
  add-note: { slot: 16, material: WRITABLE_BOOK, name: "<white>Add note", lore: ["<gray>Internal: only staff see notes."] }
  # Shown instead of claim/resolve/reject when they can't be used (closed, or claimed by someone else).
  unavailable: { material: LIGHT_GRAY_STAINED_GLASS_PANE, name: "<dark_gray><name>", lore: ["<gray><why>"] }
  why-closed: "The report is closed."
  why-claimed: "Claimed by <staff>."
  punish: { slot: 23, material: IRON_AXE, name: "<red>Punish <target>", lore: ["<gray>Opens the punish menu."] }
  history: { slot: 25, material: BOOKSHELF, name: "<aqua>History of <target>" }
  # The latest notes (up to as many as there are slots), newest first.
  note-slots: [28, 29, 30, 31, 32, 33, 34]
  note: { material: PAPER, name: "<white><author> <dark_gray><date>", lore: ["<gray><text>"] }
  back-slot: 36
  all-notes: { slot: 44, material: BOOK, name: "<white>All notes (<count>)" }

# Every note of a report, 45 a page, newest first.
report-notes:
  title: "Notes on #<id> (<page>/<pages>)"
  rows: 6
  previous-slot: 45
  back-slot: 49
  next-slot: 53
